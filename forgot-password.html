<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AI Student Assistant</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🔐
            </div>

            <h1>Reset Password</h1>

            <p class="subtitle">
                Enter your registered email
            </p>

            <form id="forgotPasswordForm">

                <div class="input-group">

                    <label for="resetEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    🔑 Reset Password
                </button>

            </form>


            <p class="switch-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
